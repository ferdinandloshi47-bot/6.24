var curMarket = 'US';
var curLang = 'zh';

var i18n = {
  zh: {
    US_title: '香水高潜趋势品推荐 · US半托管',
    EU_title: '香水高潜趋势品推荐 · EU半托管',
    subtitle: '高潜趋势品推荐 · 高潜单品机会',
    brand_dim: '品牌维度：高潜趋势品牌推荐',
    item_dim: '单品维度：高潜趋势品推荐清单',
    rank: '排名', brand: '品牌', product_title: '商品标题', spec: '规格',
    image: '图片',
    rec_brands: '推荐品牌数', rec_items: '推荐单品数'
  },
  en: {
    US_title: 'High-Potential Trend Products · US Semi-Managed',
    EU_title: 'High-Potential Trend Products · EU Semi-Managed',
    subtitle: 'High-Potential Trend Product Recommendations',
    brand_dim: 'Brand Level: High-Potential Trend Brand Recommendations',
    item_dim: 'Item Level: High-Potential Trend Product Recommendations',
    rank: 'Rank', brand: 'Brand', product_title: 'Product Title', spec: 'Spec',
    image: 'Image',
    rec_brands: 'Recommended Brands', rec_items: 'Recommended Items'
  }
};

var amzDomain = {US: 'amazon.com', EU: 'amazon.it'};

var euPriority = ['armaf','kayali','fragrance world','maison alhambra','ard al zaafaran','khadlaj','paris corner','french avenue','afnan','rayhaan','rasasi'];
var euPrioMap = {};
euPriority.forEach(function(b,i){euPrioMap[b]=i});

function t(key) { return i18n[curLang][key] || key; }

function switchMarket(market, el) {
  curMarket = market;
  document.querySelectorAll('.market-tab').forEach(function(b){b.classList.remove('active')});
  el.classList.add('active');
  document.getElementById('title').textContent = t(market+'_title');
  render();
}

function switchLang(lang, el) {
  curLang = lang;
  document.querySelectorAll('.lt-btn').forEach(function(b){b.classList.remove('on')});
  el.classList.add('on');
  document.getElementById('title').textContent = t(curMarket+'_title');
  document.getElementById('subtitle').textContent = t('subtitle');
  render();
}

function escHtml(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sortItems(items) {
  var s = items.map(function(item,idx){return Object.assign({},item,{_idx:idx})});
  if(curMarket === 'EU') {
    s.sort(function(a,b){
      var pa = euPrioMap[a.bn.toLowerCase()];
      var pb = euPrioMap[b.bn.toLowerCase()];
      if(pa !== undefined && pb !== undefined) return pa - pb;
      if(pa !== undefined) return -1;
      if(pb !== undefined) return 1;
      return a._idx - b._idx;
    });
  }
  return s;
}

function sortBrands(gb) {
  if(curMarket === 'EU') {
    gb.sort(function(a,b){
      var pa = euPrioMap[a.bn.toLowerCase()];
      var pb = euPrioMap[b.bn.toLowerCase()];
      if(pa !== undefined && pb !== undefined) return pa - pb;
      if(pa !== undefined) return -1;
      if(pb !== undefined) return 1;
      return b.c - a.c;
    });
  } else {
    gb.sort(function(a,b){return b.c-a.c});
  }
  return gb;
}

function render() {
  var gap = DATA[curMarket];
  var items = gap.not_intro;
  var el = document.getElementById('content');
  var h = '';
  var domain = amzDomain[curMarket];
  var total = items.length;
  var brands = Object.keys(items.reduce(function(m,i){m[i.bn]=1;return m},{})).length;

  h += '<div class="kr">';
  h += '<div class="kc"><div class="kl">'+t('rec_brands')+'</div><div class="kv">'+brands+'</div></div>';
  h += '<div class="kc"><div class="kl">'+t('rec_items')+'</div><div class="kv">'+total+'</div></div>';
  h += '</div>';

  var bm = {};
  items.forEach(function(i){if(!bm[i.bn])bm[i.bn]={c:0};bm[i.bn].c++});
  var gb = [];
  for(var b in bm) gb.push({bn:b, c:bm[b].c});
  gb = sortBrands(gb);

  h += '<div class="card"><h3>'+t('brand_dim')+'</h3><div class="tw"><table><thead><tr>';
  h += '<th>'+t('rank')+'</th><th>'+t('brand')+'</th><th class="r">'+t('rec_items')+'</th>';
  h += '</tr></thead><tbody>';
  gb.forEach(function(b,i){
    h += '<tr><td>'+(i+1)+'</td><td><strong>'+escHtml(b.bn)+'</strong></td><td class="r">'+b.c+'</td></tr>';
  });
  h += '</tbody></table></div></div>';

  h += '<div class="card"><h3>'+t('item_dim')+'（'+total+'）</h3><div class="tw"><table><thead><tr>';
  h += '<th>'+t('brand')+'</th><th>'+t('product_title')+'</th><th>'+t('image')+'</th>';
  h += '</tr></thead><tbody>';

  sortItems(items).forEach(function(item){
    h += '<tr>';
    h += '<td><strong>'+escHtml(item.bn)+'</strong></td>';
    h += '<td style="max-width:450px;overflow:hidden;text-overflow:ellipsis" title="'+escHtml(item.title)+'">';
    if(item.url) h += '<a href="'+escHtml(item.url)+'" target="_blank" style="color:#667eea;text-decoration:none">'+escHtml(item.title||'-')+'</a>';
    else if(item.asin) h += '<a href="https://www.'+domain+'/dp/'+escHtml(item.asin)+'" target="_blank" style="color:#667eea;text-decoration:none">'+escHtml(item.title||'-')+'</a>';
    else h += escHtml(item.title||'-');
    h += '</td>';
    h += '<td><img src="'+escHtml(item.img)+'" style="width:50px;height:50px;object-fit:cover;border-radius:4px;border:1px solid #e2e8f0" onerror="this.style.display=\'none\'"></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';
  el.innerHTML = h;
}

render();

</script>
